<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>作品库 · HF Archive</title>
<style>
:root{color-scheme:dark;--bg:#141916;--panel:#1b211e;--ink:#e8ece5;--muted:#a2ada3;--line:#303b32;--accent:#b3d39e;--soft:#24342a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,"Microsoft YaHei",sans-serif}
button,input,select{font:inherit;color:inherit}button,select,a{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button{background:transparent;border:1px solid var(--line);border-radius:7px;padding:8px 12px}button:hover{background:var(--soft)}button:disabled{opacity:.35;cursor:default}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;overflow:auto;padding:28px 18px;background:var(--panel);border-right:1px solid var(--line)}
.brand{font-size:23px;font-weight:650;letter-spacing:-.7px;margin:0 8px 4px}.sub{font-size:12px;color:var(--muted);margin:0 8px 27px}.section-label{font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);margin:22px 8px 10px}
.project{display:flex;align-items:center;gap:8px;width:100%;border:0;text-align:left;padding:9px 8px;margin:2px 0;color:var(--muted);min-height:42px}.project.active{background:var(--soft);color:var(--accent);font-weight:600}.project span:first-child{flex:1;overflow-wrap:anywhere}.project .count{font-size:12px;font-variant-numeric:tabular-nums;flex:none}
main{max-width:1680px;width:100%;margin:auto;padding:30px clamp(18px,3vw,48px) 40px}.topline{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}h1{font-size:clamp(27px,4vw,42px);line-height:1.1;letter-spacing:-.04em;margin:9px 0 8px;font-weight:620;overflow-wrap:anywhere}.meta{color:var(--muted);font-size:13px;margin:0}.bucket{font-size:12px;white-space:nowrap;margin-top:6px}.toolbar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:9px;align-items:center;padding:17px 0;margin-top:16px;background:var(--bg);border-bottom:1px solid var(--line)}
.search{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:9px 12px;min-width:160px;flex:1}.search::placeholder{color:var(--muted)}.segments{display:flex;gap:2px;background:var(--panel);padding:3px;border-radius:8px}.segments button{border:0;padding:6px 12px;color:var(--muted)}.segments button.active{background:var(--soft);color:var(--accent)}select{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px}.mobile-project{display:none}.results{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:17px 0 12px;color:var(--muted);font-size:12px}.quick-pages{display:flex;gap:5px;align-items:center}.quick-pages button{padding:5px 9px}.quick-pages span{min-width:36px;text-align:center;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,255px),1fr));gap:24px 16px}.asset{min-width:0;animation:appear .24s ease both}.media{position:relative;display:block;width:100%;aspect-ratio:4/3;border:0;padding:0;overflow:hidden;background:#202922;border-radius:6px}.media img{display:block;width:100%;height:100%;object-fit:contain;transition:transform .22s ease}.media:hover img{transform:scale(1.025)}.media-placeholder{display:grid;height:100%;place-content:center;text-align:center;gap:8px;color:var(--muted);font-size:13px}.play{display:grid;place-items:center;position:absolute;inset:0;pointer-events:none}.play span{width:50px;height:50px;display:grid;place-items:center;background:#141916d9;border:1px solid #e8ece566;border-radius:50%;font-size:22px;color:white}.asset-info{padding:10px 0 0;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}.asset-title{font-weight:600;overflow-wrap:anywhere;font-size:13px}.asset-detail{font-size:11px;color:var(--muted);overflow-wrap:anywhere;margin-top:4px}.file-type{font-size:10px;letter-spacing:.08em;color:var(--accent);white-space:nowrap;margin-top:2px}.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:22px 0;border-top:1px solid var(--line);margin-top:28px}.page-buttons{display:flex;gap:5px;flex-wrap:wrap}.page-buttons button{min-width:36px;padding:7px 10px}.page-buttons button[aria-current=page]{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:650}.empty{padding:60px 0;color:var(--muted);text-align:center}
dialog{padding:0;max-width:min(96vw,1240px);width:100%;max-height:94vh;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--ink);overflow:auto}dialog::backdrop{background:#070a08e8}body:has(dialog[open]){overflow:hidden}.viewer-top,.viewer-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;flex-wrap:wrap}.viewer-title{font-weight:600;overflow-wrap:anywhere;min-width:0}.viewer-stage{position:relative;background:#0b0f0c;display:grid;place-items:center;min-height:180px;max-height:76vh;overflow:auto}.viewer-stage img,.viewer-stage video{display:block;max-width:100%;max-height:76vh;object-fit:contain}.viewer-foot{border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.viewer-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.viewer-stage .message{padding:32px;color:var(--muted)}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@keyframes appear{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media(max-width:760px){.shell{display:block}.sidebar{position:static;height:auto;overflow:hidden;border-right:0;border-bottom:1px solid var(--line);padding:13px 18px}.brand{margin:0;font-size:19px}.sub,.section-label,#projects{display:none}.mobile-project{display:block;max-width:100%;flex:1}.toolbar{margin-top:12px;padding:12px 0}.search{width:100%;flex-basis:100%}.topline{display:block}.bucket{display:inline-block;margin-top:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}.media{aspect-ratio:1}.asset-info{display:block}.file-type{display:inline-block;margin-top:4px}main{padding-top:20px}}@media(max-width:420px){.grid{grid-template-columns:1fr}.media{aspect-ratio:4/3}.segments button{padding:6px 9px}}
</style></head><body>
<div class="shell"><aside class="sidebar"><div class="brand">Archive / 作品库</div><div class="sub">Hugging Face · 云端媒体</div><div class="section-label">项目</div><nav id="projects" aria-label="项目筛选"></nav></aside>
<main><header class="topline"><div><div class="eyebrow">MEDIA LIBRARY</div><h1 id="heading">全部作品</h1><p class="meta" id="summary"></p></div><a class="bucket" id="bucket" target="_blank" rel="noopener noreferrer">HF Bucket ↗</a></header>
<div class="toolbar"><select class="mobile-project" id="mobileProject" aria-label="项目"></select><input type="search" class="search" id="search" placeholder="搜索项目、文件名…" aria-label="搜索"><div class="segments" id="types" aria-label="媒体类型"><button data-kind="all">全部</button><button data-kind="image">图片</button><button data-kind="video">视频</button></div><select id="order" aria-label="排序"><option value="desc">项目倒序</option><option value="asc">项目正序</option><option value="size">文件大小</option></select><select id="pageSize" aria-label="每页数量"><option value="12">12 / 页</option><option value="24">24 / 页</option><option value="48">48 / 页</option></select></div>
<div class="results"><span id="range" aria-live="polite"></span><span>缩略图本地内嵌 · 原图按需加载</span><div class="quick-pages"><button id="topPrev" aria-label="上一页">←</button><span id="topPage"></span><button id="topNext" aria-label="下一页">→</button></div></div><div class="grid" id="grid"></div><div class="empty" id="empty" hidden>没有匹配的媒体。</div><footer class="pager"><span id="pageText"></span><nav class="page-buttons" id="pages" aria-label="分页"></nav></footer></main></div>
<dialog id="viewer"><div class="viewer-top"><div class="viewer-title" id="viewerTitle"></div><button id="close" aria-label="关闭">关闭 ×</button></div><div id="stage" class="viewer-stage"></div><div class="viewer-foot"><span id="viewerMeta"></span><div class="viewer-actions"><button id="prev">← 上一个</button><button id="next">下一个 →</button><a id="original" target="_blank" rel="noopener noreferrer">HF 原文件 ↗</a><button id="copy">复制链接</button></div></div></dialog>
<script type="application/json" id="archive-data">__DATA__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('archive-data').textContent), all=data.assets, $=id=>document.getElementById(id);
const state={project:'all',kind:'all',q:'',sort:'desc',size:12,page:1};let filtered=[], viewing=-1, opener=null;
const count=(n)=>n.toLocaleString('zh-CN'), bytes=n=>n>=1048576?(n/1048576).toFixed(1)+' MiB':(n/1024).toFixed(1)+' KiB';
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
const groups=new Map();for(const a of all)groups.set(a.project,(groups.get(a.project)||0)+1);
const projects=[['all',all.length],...Array.from(groups).sort((a,b)=>b[0].localeCompare(a[0]))];
for(const [name,n] of projects){const b=el('button','project');b.dataset.project=name;b.append(el('span','',name==='all'?'全部作品':name),el('span','count',n));b.onclick=()=>chooseProject(name);$('projects').append(b);const o=el('option','',name==='all'?'全部作品':name);o.value=name;$('mobileProject').append(o)}
$('bucket').href=data.bucket_url;
function chooseProject(name){state.project=name;state.page=1;render()}
$('mobileProject').onchange=e=>chooseProject(e.target.value);
$('search').oninput=e=>{state.q=e.target.value.trim().toLowerCase();state.page=1;render()};
$('types').onclick=e=>{const b=e.target.closest('button');if(!b)return;state.kind=b.dataset.kind;state.page=1;render()};
$('order').onchange=e=>{state.sort=e.target.value;state.page=1;render()};
$('pageSize').onchange=e=>{state.size=Number(e.target.value);state.page=1;render()};
function movePage(delta){state.page+=delta;render();window.scrollTo({top:0,behavior:'instant'})}
$('topPrev').onclick=()=>movePage(-1);$('topNext').onclick=()=>movePage(1);
function pageButton(label,p,disabled=false){const b=el('button','',label);b.disabled=disabled;if(p===state.page&&typeof label==='number')b.setAttribute('aria-current','page');b.onclick=()=>{state.page=p;render();window.scrollTo({top:0,behavior:'instant'})};return b}
function render(){
 filtered=all.filter(a=>(state.project==='all'||a.project===state.project)&&(state.kind==='all'||a.kind===state.kind)&&(!state.q||(a.relative+' '+a.stored_sha256).toLowerCase().includes(state.q)));
 filtered.sort((a,b)=>state.sort==='size'?b.stored_bytes-a.stored_bytes||a.relative.localeCompare(b.relative):((state.sort==='desc'?b.project.localeCompare(a.project):a.project.localeCompare(b.project))||a.relative.localeCompare(b.relative)));
 const last=Math.max(1,Math.ceil(filtered.length/state.size));state.page=Math.min(state.page,last);const start=(state.page-1)*state.size,end=Math.min(start+state.size,filtered.length);
 $('heading').textContent=state.project==='all'?'全部作品':state.project;$('summary').textContent=count(all.length)+' 个已校验媒体 · '+groups.size+' 个项目 · '+bytes(all.reduce((n,a)=>n+a.stored_bytes,0))+' 云端资产（按作品计）';
 $('range').textContent=filtered.length?'显示 '+(start+1)+'–'+end+' / '+count(filtered.length)+' 个媒体':'0 个媒体';
 $('mobileProject').value=state.project;document.querySelectorAll('.project').forEach(b=>{const active=b.dataset.project===state.project;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});
 document.querySelectorAll('[data-kind]').forEach(b=>{const active=b.dataset.kind===state.kind;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});
 $('grid').replaceChildren();$('empty').hidden=filtered.length!==0;
 for(let i=start;i<end;i++){const a=filtered[i],article=el('article','asset'),button=el('button','media');button.type='button';button.setAttribute('aria-label','预览 '+a.name);button.onclick=()=>openViewer(i,button);
 if(a.thumb){const img=el('img');img.src=a.thumb;img.alt=a.name;img.loading='lazy';img.decoding='async';button.append(img)}else{button.append(el('div','media-placeholder',a.kind==='video'?'VIDEO · 点击播放':'IMAGE · 点击查看'))}
 if(a.kind==='video'){const play=el('div','play');play.append(el('span','','▶'));button.append(play)}
 const info=el('div','asset-info'),label=el('div');label.append(el('div','asset-title',a.name),el('div','asset-detail',a.project+' · '+bytes(a.stored_bytes)));info.append(label,el('span','file-type',a.kind==='video'?'MP4':a.path.split('.').pop().toUpperCase()));article.append(button,info);$('grid').append(article)}
 $('topPage').textContent=state.page+' / '+last;$('topPrev').disabled=state.page<=1;$('topNext').disabled=state.page>=last;$('pageText').textContent='第 '+state.page+' / '+last+' 页';$('pages').replaceChildren(pageButton('上一页',state.page-1,state.page<=1));
 const nums=[...new Set([1,...Array.from({length:5},(_,i)=>state.page+i-2).filter(n=>n>=1&&n<=last),last])].sort((a,b)=>a-b);let prior=0;
 for(const n of nums){if(prior&&n-prior>1)$('pages').append(el('span','','…'));$('pages').append(pageButton(n,n));prior=n}
 $('pages').append(pageButton('下一页',state.page+1,state.page>=last));
}
function clearStage(){for(const v of $('stage').querySelectorAll('video')){v.pause();v.removeAttribute('src');v.load()}$('stage').replaceChildren()}
function openViewer(i,button=null){if(i<0||i>=filtered.length)return;if(button)opener=button;viewing=i;const a=filtered[i];clearStage();$('viewerTitle').textContent=a.relative;$('viewerMeta').textContent=(i+1)+' / '+filtered.length+' · '+bytes(a.stored_bytes)+' · SHA-256 已校验';$('original').href=a.url;$('prev').disabled=i===0;$('next').disabled=i===filtered.length-1;$('copy').textContent='复制链接';
 const media=el(a.kind==='video'?'video':'img');media.addEventListener('error',()=>{if(viewing!==i)return;clearStage();$('stage').append(el('div','message','HF 媒体暂时无法加载，请重试或打开原文件。'))},{once:true});
 if(a.kind==='video'){media.controls=true;media.preload='none';media.playsInline=true;if(a.thumb)media.poster=a.thumb}else{media.alt=a.name;media.decoding='async'}media.src=a.url;$('stage').append(media);if(!$('viewer').open)$('viewer').showModal();}
$('close').onclick=()=>$('viewer').close();$('viewer').addEventListener('close',()=>{clearStage();viewing=-1;if(opener?.isConnected)opener.focus();opener=null});$('viewer').onclick=e=>{if(e.target===$('viewer'))$('viewer').close()};$('prev').onclick=()=>openViewer(viewing-1);$('next').onclick=()=>openViewer(viewing+1);
document.addEventListener('keydown',e=>{if(!$('viewer').open||e.target.tagName==='VIDEO')return;if(e.key==='ArrowLeft'){e.preventDefault();openViewer(viewing-1)}if(e.key==='ArrowRight'){e.preventDefault();openViewer(viewing+1)}});
$('copy').onclick=async()=>{const url=filtered[viewing]?.url;if(!url)return;try{await navigator.clipboard.writeText(url);$('copy').textContent='已复制'}catch{window.prompt('复制 HF 链接',url)}};
render();
</script></body></html>
