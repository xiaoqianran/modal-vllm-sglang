<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>图像工作台</title>
<style>
:root{color-scheme:dark;--bg:#141619;--panel:#202328;--edge:#343840;--muted:#adb2bc;--accent:#e0b78d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f1eee7;font-family:system-ui,sans-serif;font-size:15px}
main{max-width:1080px;margin:auto;padding:28px 20px 40px}header{display:flex;align-items:baseline;gap:16px;justify-content:space-between}
h1{font-size:32px;letter-spacing:.03em;margin:12px 0}p{line-height:1.55}header p,.sub{color:var(--muted)}
form,.card{border:1px solid var(--edge);border-radius:16px;background:var(--panel)}form{padding:16px;margin:22px 0;display:grid;gap:12px}
textarea{width:100%;font:inherit;min-height:86px;resize:vertical;background:#16181c;color:inherit;border:1px solid var(--edge);border-radius:10px;padding:12px}
button,select,.upload,.download{font:inherit;color:inherit;border:1px solid var(--edge);border-radius:8px;background:#292d33;padding:8px 12px;cursor:pointer}
button[type=submit]{background:var(--accent);color:#211a14;font-weight:bold}button:disabled{opacity:.5;cursor:default}.controls,.card footer{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#work{min-height:1.6em;color:var(--accent);margin:0}#results{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:14px}
.card{overflow:hidden}.card.active{outline:2px solid var(--accent)}.card img{display:block;width:100%;height:180px;object-fit:contain;background:#101114}
.card p,.card footer{margin:10px 12px;overflow-wrap:anywhere}.download{text-decoration:none}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--accent)}
@media(max-width:600px){main{padding:12px}header{display:block}h1{font-size:26px}}
</style></head>
<body><main>
<header><h1>图像工作台</h1><p>MiniMax H3 Image · 私人预览</p></header>
<p class="sub">从一句话开始，或拖入一张图。每次修改另存一版，不覆盖原图。</p>
<form id="compose">
  <label id="target" for="prompt">新图 · 默认电影画幅</label>
  <textarea id="prompt" required maxlength="3000" placeholder="一张雨夜老城区的电影剧照，冷色霓虹……"></textarea>
  <div class="controls">
    <label class="upload">上传原图 <input id="file" type="file" accept="image/png,image/jpeg,image/webp" hidden></label>
    <select aria-label="画幅" id="aspect"><option>16:9</option><option>1:1</option><option>9:16</option></select>
    <button id="clear" type="button" hidden>取消选图</button>
    <button type="submit" id="send">生成图片</button>
  </div>
  <p role="status" id="work"></p>
</form>
<section aria-label="图片版本" id="results"></section>
</main>
<script>
const el=id=>document.getElementById(id);
function load(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}}
function save(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch{}}
let assets=load("imageStudioHistory",[]),selected=null,busy=false;
const status=message=>{el("work").textContent=message};
const button=(label,fn)=>{const b=document.createElement("button");b.type="button";b.textContent=label;b.onclick=fn;return b};
function select(id){selected=id;draw()}
function add(item){assets=[item,...assets.filter(a=>a.id!==item.id)];save("imageStudioHistory",assets);select(item.id)}
function draw(){
  const current=assets.find(x=>x.id===selected);
  el("target").textContent=current?"修改所选图片 · 保留原画幅":"新图 · 选择画幅";
  el("send").textContent=current?"提交修改":"生成图片";
  el("prompt").placeholder=current?"例如：只把伞改成黄色，人物和背景不变":"描述想生成的图片……";
  el("aspect").disabled=Boolean(current);el("clear").hidden=!current;
  el("results").replaceChildren(...assets.map(a=>{
    const card=document.createElement("article");card.className="card"+(a.id===selected?" active":"");
    const image=document.createElement("img");image.src="/assets/"+a.id;image.alt=a.prompt||"上传的原图";image.loading="lazy";
    const line=document.createElement("p");line.textContent=a.prompt||"上传原图";
    const footer=document.createElement("footer");
    const again=button("继续修改",()=>{select(a.id);el("prompt").focus()});
    const link=document.createElement("a");link.href=image.src;link.download="studio-"+a.id;link.textContent="下载";link.className="download";
    footer.append(again,link);
    if(a.parent_id)footer.append(button("选上一版",()=>select(a.parent_id)));
    card.append(image,line,footer);return card;
  }));
}
async function api(path,options={}){
  const r=await fetch(path,{...options,headers:{"X-Studio-Request":"1",...options.headers}});
  if(!r.ok){const data=await r.json().catch(()=>({}));throw Error(typeof data.detail==="string"?data.detail:"请求失败（"+r.status+"）")}
  return r.json();
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function working(value){busy=value;el("send").disabled=value;el("file").disabled=value}
async function poll(id){
  for(let n=0;n<400;n++){
    let job;
    try{job=await api("/jobs/"+id)}catch(err){
      if(n===399)throw err;status("连接中断，正在重新查询任务…");await wait(4000);continue;
    }
    if(job.status==="ready"){add(job.asset);save("imageStudioPending",null);status("完成，可以继续修改。");return}
    if(job.status==="failed"||job.status==="stalled"){save("imageStudioPending",null);throw Error(job.error)}
    status(job.status==="queued"?"正在排队…":"正在生成图片…");
    await wait(5000);
  }
  status("暂时没有结果，刷新后可继续查询。");
}
el("compose").onsubmit=async e=>{
  e.preventDefault();if(busy)return;working(true);status("正在提交…");
  try{
    const job=await api("/jobs",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({operation:selected?"edit":"generate",parent_id:selected,prompt:el("prompt").value,aspect:el("aspect").value})});
    save("imageStudioPending",job.id);el("prompt").value="";await poll(job.id);
  }catch(err){status(err.message)}finally{working(false)}
};
async function upload(file){
  if(!file||busy)return;working(true);status("正在上传…");
  try{
    if(file.size>12*1024*1024)throw Error("上传不能超过 12 MiB");
    const asset=await api("/uploads",{method:"POST",body:file});add(asset);status("已选原图，可以直接输入修改要求。");
  }catch(err){status(err.message)}finally{working(false);el("file").value=""}
}
el("clear").onclick=()=>select(null);
el("file").onchange=e=>upload(e.target.files[0]);
el("compose").ondragover=e=>e.preventDefault();
el("compose").ondrop=e=>{e.preventDefault();upload(e.dataTransfer.files[0])};
draw();
const pending=load("imageStudioPending",null);
if(pending){working(true);poll(pending).catch(err=>status(err.message)).finally(()=>working(false))}
</script>
</body></html>
