[project]
name = "modal-inference-workflows"
version = "0.1.0"
description = "Local CPU orchestration for independent inference services"
requires-python = ">=3.11"
dependencies = [
    "modal[api-proxy-support]>=1.6.4,<2",
    "modal-benchmark==0.3.1",
    "pillow>=13.0.0",
    "huggingface-hub>=2.4.0",
    "python-dotenv>=1.2.4",
]

[[tool.uv.index]]
name = "pypi-official"
url = "https://pypi.org/simple"
explicit = true

[tool.uv]
package = false

[tool.uv.sources]
modal-benchmark = { index = "pypi-official" }
